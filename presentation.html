<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西游造物 · 课堂演示初稿</title><link rel="icon" href="assets/logo.svg"><style>*{box-sizing:border-box}body{margin:0;background:#25352e;color:#f5f1e8;font-family:'PingFang SC','Microsoft YaHei',sans-serif}.deck{min-height:100vh;padding:5vh 7vw;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c8d0bd}header img{width:42px;vertical-align:middle;margin-right:10px}a{color:inherit}#slide{flex:1;display:grid;align-content:center;padding:5vh 0}h1{font-family:serif;font-size:clamp(36px,6vw,80px);line-height:1.3;margin:15px 0 25px;max-width:950px}h2{font-family:serif;font-size:clamp(30px,4vw,60px);line-height:1.4;margin:15px 0 25px}.kicker{color:#e6b770;font-size:12px;letter-spacing:3px}p,li{font-size:clamp(15px,1.8vw,25px);line-height:1.8;max-width:980px;color:#d5dcca}ul{padding-left:25px}footer{display:flex;justify-content:space-between;align-items:center;gap:15px}button{background:#c5492a;color:#fff9ef;border:0;padding:12px 20px;border-radius:6px;cursor:pointer;font-size:14px}button:disabled{opacity:.4;cursor:default}.slide-img{width:min(650px,100%);border-radius:12px;mix-blend-mode:screen;display:block}.split{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px}.small{font-size:12px;color:#aab99e}.progress{height:3px;background:#526249;position:fixed;bottom:0;left:0;transition:width .3s;background:#e6b770}button:focus-visible,a:focus-visible{outline:3px solid #f0d383;outline-offset:5px}@media(max-width:750px){.split{grid-template-columns:1fr;gap:10px}.deck{padding:25px}p,li{font-size:17px}footer .small{display:none}.slide-img{max-height:35vh;object-fit:contain}}@media print{body{background:white;color:black}.deck{display:block;padding:0}header,footer,.progress{display:none}#slide{display:block}article{break-after:page}h1,h2{font-size:32px}p,li{font-size:18px;color:black}.kicker{color:#a34628}}
</style></head><body><div class="deck"><header><span><img src="assets/logo.svg" alt="西游造物 Logo">西游造物 / 课堂演示初稿</span><a href="index.html">返回互动网站 ↗</a></header><main id="slide" aria-live="polite"></main><footer><button id="prev">← 上一页</button><span class="small">方向键切页 · 按 F 由浏览器支持全屏</span><span id="counter"></span><button id="next">下一页 →</button></footer></div><div class="progress" id="progress"></div><script>
const slides=[
['01 / XIYOU MAKERS','把西游，捧在手里。','<p>《西游记》语文小组活动<br>第五项：制作公共手办，赠送老师与同学。</p><p class="small">根据当前资料整理的网页演示，非已上传的正式 PPT。</p>'],
['02 / WHY WE MAKE','从阅读，到一份礼物。','<ul><li>读懂人物关系与故事背景。</li><li>把文字里的形象转化为立体场景。</li><li>用共同创作与赠送，分享经典阅读的体验。</li></ul>'],
['03 / THE DESIGN','孙悟空大战青狮精','<div class="split"><div><p>孙悟空持金箍棒，青狮精持刀迎战。<br>双方全身，共用山石底座。</p><p class="small">AI 概念参考图，不是实物照片；最终细节取决于模型与打印条件。</p></div><img class="slide-img" src="assets/battle.jpg" alt="手办概念图"></div>'],
['04 / THE STORY','先认清青狮，再进入狮驼岭。','<ul><li>青狮精是狮驼岭三魔之一，原为文殊菩萨的坐骑。</li><li>通行百回本第七十四至七十七回展开这一段故事。</li><li>金色鬃毛来自参考造型；本项目人物名称统一为青狮精。</li></ul>'],
['05 / THE MAKING','让造型，也经得起落地。','<ul><li>概念设计与模型生成：已进行尝试。</li><li>检查兵器、尾巴、飘带等结构强度。</li><li>由打印协助者确认尺寸、材料与支撑，先试打再调整。</li></ul><p class="small">最终尺寸、费用、份数、试打结果与完成日期待确认。</p>'],
['06 / THE TEAM','七个人，一个西游故事。','<p>August Liu · Lucas Li · Jasper Zhu<br>Jeff Feng · Junyi Yao · Justin Liu · George Shi</p><p class="small">具体分工待小组共同确认。</p>'],
['07 / CO-CREATE WITH US','让同学也加入创作。','<ul><li>看人物档案，闯西游知识小关。</li><li>给喜欢的角色与风格投一票。</li><li>在纸条墙提出建议与展示心愿。</li><li>一起完善计划，再带着作品进入课堂。</li></ul>'],
['08 / THE NEXT CHAPTER','下一回，一起完成。','<p>确认模型 → 试打调整 → 完善讲解 → 展示与赠送</p><p>谢谢观看。欢迎给造物小队递一张纸条。</p><p><a href="index.html#square">打开同学广场 ↗</a></p>']
];let i=0;function render(){const s=slides[i];document.getElementById('slide').innerHTML='<span class="kicker">'+s[0]+'</span><h1>'+s[1]+'</h1>'+s[2];document.getElementById('counter').textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;document.getElementById('progress').style.width=(i+1)/slides.length*100+'%'}function go(d){i=Math.min(slides.length-1,Math.max(0,i+d));render()}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft')go(-1);if(e.key.toLowerCase()==='f'&&document.documentElement.requestFullscreen){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}});render();</script></body></html>
